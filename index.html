<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <meta name="description" content="UI設計・フロントエンド実装・AI駆動開発・低コストDX推進のポートフォリオ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-color: #38bdf8;
      --accent-hover: #7dd3fc;
      --text-main: #ffffff;
      --text-sub: #f1f5f9;
      --text-muted: #cbd5e1;
      --text-shadow: 0 2px 4px rgba(0, 0, 0, 0.65), 0 0 12px rgba(0, 0, 0, 0.45);
      --badge-bg: rgba(255, 255, 255, 0.2);
      --badge-border: rgba(255, 255, 255, 0.35);
      --btn-bg: rgba(255, 255, 255, 0.15);
      --btn-border: rgba(255, 255, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
      color: var(--text-main);
      line-height: 1.8;
      min-height: 100vh;
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    /* 全体コンテナ */
    .container {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 50px 20px 100px 20px;
    }

    /* ヒーローヘッダー */
    .hero {
      text-align: center;
      padding: 30px 0 40px 0;
    }
    .hero-title {
      font-family: 'Poppins', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      margin-bottom: 8px;
    }
    .hero-subtitle {
      color: var(--text-sub);
      font-size: 1.05rem;
      font-weight: 700;
      text-shadow: var(--text-shadow);
      letter-spacing: 0.03em;
    }

    /* ナビゲーション */
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 60px;
    }
    .nav-link {
      color: #ffffff;
      text-decoration: none;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      transition: all 0.25s ease;
    }
    .nav-link:hover {
      background: rgba(255, 255, 255, 0.35);
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    /* セクション共通（カード枠なし） */
    .section-wrapper {
      margin-bottom: 70px;
    }
    .section-header {
      margin-bottom: 24px;
      text-align: left;
    }
    .section-tag {
      display: inline-block;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent-color);
      text-shadow: var(--text-shadow);
    }
    .section-title {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .section-title::after {
      content: "";
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.6) 0%, transparent 100%);
    }

    /* セクション下部バナー */
    .section-divider-banner {
      width: 100%;
      margin-top: 40px;
      display: flex;
      justify-content: center;
    }
    .section-divider-banner img {
      max-width: 100%;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      transition: transform 0.3s ease;
    }
    .section-divider-banner img:hover {
      transform: translateY(-2px);
    }

    /* ---------------- About ---------------- */
    .about-lead {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: var(--text-shadow);
      margin-bottom: 24px;
      line-height: 1.7;
    }
    .about-lead-sub {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-sub);
      display: block;
      margin-top: 6px;
    }
    .about-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }
    .about-item {
      font-size: 0.98rem;
      text-shadow: var(--text-shadow);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .about-item-summary {
      font-weight: 700;
      color: var(--accent-color);
      font-size: 1.05rem;
    }
    .about-item-detail {
      color: var(--text-sub);
      font-weight: 500;
    }
    .about-closing {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: var(--text-shadow);
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px dashed rgba(255, 255, 255, 0.3);
    }

    /* ---------------- TechStack ---------------- */
    .tech-stack-list {
      display: flex;
      flex-direction: column;
      gap: 26px;
    }
    .tech-group-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: var(--text-shadow);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tech-group-title::before {
      content: "●";
      color: var(--accent-color);
      font-size: 0.8rem;
    }
    .tech-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 14px;
    }
    .tech-line {
      font-size: 0.95rem;
      color: var(--text-sub);
      text-shadow: var(--text-shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
    }
    .tech-badge {
      display: inline-block;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: #ffffff;
      padding: 1px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      backdrop-filter: blur(4px);
    }

    /* ---------------- Works ---------------- */
    .works-list {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .work-entry {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .work-thumb-wrap {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .work-thumb-wrap img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.35s ease;
    }
    .work-thumb-wrap:hover img {
      transform: scale(1.02);
    }
    .work-info-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: var(--text-shadow);
    }
    .work-info-comment {
      font-size: 0.96rem;
      color: var(--text-sub);
      text-shadow: var(--text-shadow);
      white-space: pre-wrap;
    }
    .work-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .work-tag {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      backdrop-filter: blur(4px);
    }
    .work-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
    }
    .btn-main {
      background: var(--accent-color);
      color: #000000;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
    }
    .btn-main:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.6);
    }
    .btn-sub {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: #ffffff;
      text-shadow: var(--text-shadow);
    }
    .btn-sub:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    /* ---------------- Strengths ---------------- */
    .strengths-list {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .strength-entry {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .strength-lead {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: var(--text-shadow);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .strength-lead::before {
      content: "◆";
      color: var(--accent-color);
      font-size: 0.9rem;
    }
    .strength-body {
      font-size: 0.95rem;
      color: var(--text-sub);
      text-shadow: var(--text-shadow);
      padding-left: 18px;
    }

    /* ---------------- Contact ---------------- */
    .contact-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
    }
    .contact-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      text-shadow: var(--text-shadow);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }
    .contact-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      border-color: #ffffff;
      transform: translateY(-2px);
    }
    .contact-btn-tag {
      color: var(--accent-color);
      font-family: 'Poppins', sans-serif;
    }

    /* フッター */
    footer {
      text-align: center;
      margin-top: 60px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-shadow: var(--text-shadow);
    }

    .status-msg {
      text-align: center;
      padding: 60px 20px;
      font-size: 1.1rem;
      color: #ffffff;
      text-shadow: var(--text-shadow);
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 16px 80px 16px;
      }
      .hero-title {
        font-size: 2.2rem;
      }
      .section-title {
        font-size: 1.6rem;
      }
      .contact-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="hero">
      <h1 class="hero-title">Portfolio</h1>
      <p class="hero-subtitle">UI Design & Frontend Development / AI-Assisted DX</p>
    </header>

    <nav class="nav-bar">
      <a href="#about" class="nav-link">About</a>
      <a href="#techstack" class="nav-link">TechStack</a>
      <a href="#works" class="nav-link">Works</a>
      <a href="#strengths" class="nav-link">Strengths</a>
      <a href="#contact" class="nav-link">Contact</a>
    </nav>

    <main id="app">
      <div class="status-msg">データを読み込み中...</div>
    </main>

    <footer>
      <p>&copy; <span id="year"></span> Portfolio. All rights reserved.</p>
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    async function loadPortfolio() {
      const app = document.getElementById('app');
      try {
        const res = await fetch('./data.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const data = await res.json();

        // 1. 背景画像の設定（黒マスクなし）
        const bgAsset = (data.asset || []).find(a => a.title === 'ページ背景');
        if (bgAsset && bgAsset.image) {
          document.body.style.backgroundImage = `url('${bgAsset.image}')`;
        }

        // バナーアセットのマップ
        const bannerMap = {};
        (data.asset || []).forEach(a => {
          if (a.type === 'banner' || a.title) {
            bannerMap[a.title] = a.image;
          }
        });

        let html = '';

        // ------------------ (1) About ------------------
        if (data.About && data.About.length > 0) {
          html += `
          <section id="about" class="section-wrapper">
            <div class="section-header">
              <span class="section-tag">Profile</span>
              <h2 class="section-title">About</h2>
            </div>
            <div class="about-content">`;

          const leadItem = data.About.find(item => item.id === 1);
          if (leadItem) {
            html += `
              <div class="about-lead">
                ${escapeHtml(leadItem.summary)}
                <span class="about-lead-sub">${escapeHtml(leadItem.detail)}</span>
              </div>`;
          }

          html += `<div class="about-list">`;
          data.About.filter(item => item.id > 1 && item.id < 5).forEach(item => {
            html += `
              <div class="about-item">
                ${item.summary ? `<span class="about-item-summary">${escapeHtml(item.summary)}</span>` : ''}
                <span class="about-item-detail">${escapeHtml(item.detail)}</span>
              </div>`;
          });
          html += `</div>`;

          const closingItem = data.About.find(item => item.id === 5);
          if (closingItem) {
            html += `<div class="about-closing">${escapeHtml(closingItem.detail)}</div>`;
          }

          html += `</div>`;

          if (bannerMap['About']) {
            html += `
              <div class="section-divider-banner">
                <img src="${bannerMap['About']}" alt="About Banner" loading="lazy">
              </div>`;
          }

          html += `</section>`;
        }

        // ------------------ (2) TechStack ------------------
        if (data.TechStack && data.TechStack.length > 0) {
          html += `
          <section id="techstack" class="section-wrapper">
            <div class="section-header">
              <span class="section-tag">Skills & Technology</span>
              <h2 class="section-title">TechStack</h2>
            </div>
            <div class="tech-stack-list">`;

          data.TechStack.forEach(cat => {
            html += `
              <div class="tech-group">
                <div class="tech-group-title">${escapeHtml(cat.technology)}</div>
                <div class="tech-items">`;
            (cat.skills || []).forEach(skill => {
              html += `
                <div class="tech-line">
                  ${skill.system ? `<span class="tech-badge">${escapeHtml(skill.system)}</span>` : ''}
                  <span>${escapeHtml(skill.explanation)}</span>
                </div>`;
            });
            html += `</div></div>`;
          });

          html += `</div>`;

          if (bannerMap['TechStack']) {
            html += `
              <div class="section-divider-banner">
                <img src="${bannerMap['TechStack']}" alt="TechStack Banner" loading="lazy">
              </div>`;
          }

          html += `</section>`;
        }

        // ------------------ (3) Works ------------------
        if (data.Works && data.Works.length > 0) {
          html += `
          <section id="works" class="section-wrapper">
            <div class="section-header">
              <span class="section-tag">Portfolio & Showcase</span>
              <h2 class="section-title">Works</h2>
            </div>
            <div class="works-list">`;

          data.Works.forEach(work => {
            html += `
              <div class="work-entry">
                ${work.image ? `
                  <div class="work-thumb-wrap">
                    <img src="${work.image}" alt="${escapeHtml(work.title)}" loading="lazy">
                  </div>` : ''}
                <div class="work-info-title">${escapeHtml(work.title)}</div>
                <div class="work-info-comment">${escapeHtml(work.comment)}</div>
                ${work.tags && work.tags.length > 0 ? `
                  <div class="work-tags">
                    ${work.tags.map(t => `<span class="work-tag">${escapeHtml(t)}</span>`).join('')}
                  </div>` : ''}
                <div class="work-btn-group">
                  ${work.web ? `<a href="${work.web}" target="_blank" rel="noopener noreferrer" class="btn btn-main">Webサイトを見る ↗</a>` : ''}
                  ${work.admin ? `<a href="${work.admin}" target="_blank" rel="noopener noreferrer" class="btn btn-sub">管理画面 ↗</a>` : ''}
                  ${work.github ? `<a href="${work.github}" target="_blank" rel="noopener noreferrer" class="btn btn-sub">GitHub ↗</a>` : ''}
                </div>
              </div>`;
          });

          html += `</div>`;

          if (bannerMap['Works']) {
            html += `
              <div class="section-divider-banner">
                <img src="${bannerMap['Works']}" alt="Works Banner" loading="lazy">
              </div>`;
          }

          html += `</section>`;
        }

        // ------------------ (4) Strengths ------------------
        if (data.Strengths && data.Strengths.length > 0) {
          html += `
          <section id="strengths" class="section-wrapper">
            <div class="section-header">
              <span class="section-tag">Value & Approach</span>
              <h2 class="section-title">Strengths</h2>
            </div>
            <div class="strengths-list">`;

          data.Strengths.forEach(st => {
            html += `
              <div class="strength-entry">
                <div class="strength-lead">${escapeHtml(st.summary)}</div>
                <div class="strength-body">${escapeHtml(st.detail)}</div>
              </div>`;
          });

          html += `</div>`;

          if (bannerMap['Strengths']) {
            html += `
              <div class="section-divider-banner">
                <img src="${bannerMap['Strengths']}" alt="Strengths Banner" loading="lazy">
              </div>`;
          }

          html += `</section>`;
        }

        // ------------------ (5) Contact ------------------
        if (data.Contact && data.Contact.length > 0) {
          html += `
          <section id="contact" class="section-wrapper">
            <div class="section-header">
              <span class="section-tag">Get in touch</span>
              <h2 class="section-title">Contact</h2>
            </div>
            <div class="contact-links">`;

          data.Contact.forEach(ct => {
            const isEmail = ct.value.includes('@') && !ct.value.startsWith('http');
            const href = isEmail ? `mailto:${ct.value}` : ct.value;

            html += `
              <a href="${href}" target="_blank" rel="noopener noreferrer" class="contact-btn">
                <span class="contact-btn-tag">${escapeHtml(ct.item)}:</span>
                <span>${escapeHtml(ct.value)}</span>
              </a>`;
          });

          html += `</div></section>`;
        }

        app.innerHTML = html;

      } catch (err) {
        console.error(err);
        app.innerHTML = `
          <div class="status-msg" style="color: #fca5a5;">
            データの読み込みに失敗しました。<br>
            <span style="font-size:0.9rem;">${escapeHtml(err.message)}</span>
          </div>`;
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    loadPortfolio();
  </script>
</body>
</html>
