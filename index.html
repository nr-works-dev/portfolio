<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <meta name="description" content="UI設計・フロントエンド実装・AI駆動開発・低コストDX推進のポートフォリオ">
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Poppins:wght@600;700;800&family=Outfit:wght@600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --text-main: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --tag-bg: #e2e8f0;
      --tag-text: #475569;
      --tag-border: #cbd5e1;
      --btn-bg: #ffffff;
      --btn-border: #cbd5e1;
      --nav-accent: #00158f;
      --logo-accent: #ff477e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      color: var(--text-body);
      line-height: 1.85;
      min-height: 100vh;
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    /* ---------------- 上部固定ヘッダー ---------------- */
    .site-header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
      z-index: 10000;
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .header-logo {
      font-family: 'Outfit', 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 1.45rem;
      color: var(--logo-accent);
      text-decoration: none;
      letter-spacing: 0.04em;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .header-nav a {
      text-decoration: none;
      color: var(--nav-accent);
      font-family: 'Fredoka', 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .header-nav a:hover {
      color: var(--primary-color);
      background: rgba(2, 132, 199, 0.08);
    }

    /* 全体コンテナ */
    .container {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 30px 20px 80px 20px;
    }

    /* ヒーローセクション */
    .hero {
      text-align: center;
      padding: 24px 0 36px 0;
    }
    .hero-title {
      font-family: 'Poppins', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    /* セクション共通 */
    .section-wrapper {
      margin-bottom: 70px;
      scroll-margin-top: 85px; /* 固定ヘッダー分の余白 */
    }
    .section-header {
      margin-bottom: 24px;
      text-align: left;
    }
    .section-tag {
      display: inline-block;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--primary-color);
      margin-bottom: 2px;
    }
    .section-title {
      font-family: 'Poppins', 'Noto Sans JP', sans-serif;
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 14px;
      letter-spacing: 0.02em;
    }
    .section-title::after {
      content: "";
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, #cbd5e1 0%, transparent 100%);
    }

    /* セクション下部バナー */
    .section-divider-banner {
      width: 100vw;
      position: relative;
      left: 50%;
      right: 50%;
      margin-left: -50vw;
      margin-right: -50vw;
      margin-top: 50px;
      margin-bottom: 20px;
      line-height: 0;
      overflow: hidden;
    }
    .section-divider-banner img {
      width: 100%;
      height: auto;
      display: block;
      box-shadow: none;
      border: none;
      border-radius: 0;
      outline: none;
    }

    /* ---------------- About ---------------- */
    .about-lead {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 24px;
      line-height: 1.75;
      letter-spacing: 0.01em;
    }
    .about-lead-sub {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-body);
      display: block;
      margin-top: 8px;
    }
    .about-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }
    .about-item {
      font-size: 0.98rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .about-item-summary {
      font-weight: 800;
      color: var(--primary-dark);
      font-size: 1.05rem;
    }
    .about-item-detail {
      color: var(--text-body);
      font-weight: 500;
      line-height: 1.8;
    }
    .about-closing {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 24px;
      padding-top: 16px;
      border-top: 2px dashed #cbd5e1;
      line-height: 1.75;
    }

    /* ---------------- TechStack ---------------- */
    .tech-stack-list {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .tech-group-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tech-group-title::before {
      content: "●";
      color: var(--primary-color);
      font-size: 0.82rem;
    }
    .tech-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-left: 14px;
    }
    .tech-line {
      font-size: 0.96rem;
      color: var(--text-body);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
    }
    .tech-badge {
      display: inline-block;
      background: var(--primary-light);
      border: 1px solid #bae6fd;
      color: var(--primary-dark);
      padding: 1px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.88rem;
    }

    /* ---------------- Works ---------------- */
    .works-list {
      display: flex;
      flex-direction: column;
      gap: 46px;
    }
    .work-entry {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .work-thumb-wrap {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #cbd5e1;
    }
    .work-thumb-wrap img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }
    .work-info-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .work-info-comment {
      font-size: 0.98rem;
      color: var(--text-body);
      white-space: pre-wrap;
      line-height: 1.8;
    }

    /* 技術タグ（平坦な情報表示） */
    .work-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .work-tag {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 6px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: var(--tag-text);
      letter-spacing: 0.02em;
    }

    /* 遷移ボタン群（タグと明確に差別化された立体的なボタンスタイル） */
    .work-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 10px 22px;
      border-radius: 30px;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
    }
    .btn-main {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: 1.5px solid transparent;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }
    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
    }
    .btn-sub {
      background: #ffffff;
      border: 1.5px solid #94a3b8;
      color: var(--text-main);
    }
    .btn-sub:hover {
      background: #f8fafc;
      border-color: var(--primary-color);
      color: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    }

    /* ---------------- Strengths ---------------- */
    .strengths-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .strength-entry {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .strength-lead {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .strength-lead::before {
      content: "◆";
      color: var(--primary-color);
      font-size: 0.85rem;
    }
    .strength-body {
      font-size: 0.96rem;
      color: var(--text-body);
      padding-left: 20px;
      line-height: 1.8;
    }

    /* ---------------- Contact（専用ボタンスタイル） ---------------- */
    .contact-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-top: 10px;
    }
    .contact-buttons-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    /* メールボタン（画像3枚目風） */
    .btn-contact-mail {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 36px;
      border-radius: 9999px;
      background: #5b4be2;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.05rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(91, 75, 226, 0.35);
      transition: all 0.2s ease;
      letter-spacing: 0.03em;
    }
    .btn-contact-mail:hover {
      background: #4a3ac9;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(91, 75, 226, 0.45);
    }
    .btn-contact-mail i {
      font-size: 1.15rem;
    }

    /* Xボタン（画像4枚目風） */
    .btn-contact-x {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 32px;
      border-radius: 9999px;
      background: #18181b;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.02rem;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
      letter-spacing: 0.03em;
    }
    .btn-contact-x:hover {
      background: #000000;
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
    .btn-contact-x i {
      font-size: 1.15rem;
    }

    /* 汎用リンクボタン */
    .btn-contact-general {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 9999px;
      background: #ffffff;
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.98rem;
      text-decoration: none;
      border: 1.5px solid var(--btn-border);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
    }
    .btn-contact-general:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
      transform: translateY(-2px);
    }

    /* メール下部のアドレス案内テキスト */
    .contact-email-fallback {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      margin-top: -6px;
      background: rgba(255, 255, 255, 0.7);
      padding: 4px 16px;
      border-radius: 20px;
      border: 1px dashed #cbd5e1;
    }
    .contact-email-fallback span {
      color: var(--primary-dark);
      font-family: 'Poppins', sans-serif;
      margin-left: 4px;
      user-select: all;
    }

    /* フッター */
    footer {
      text-align: center;
      margin-top: 60px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-msg {
      text-align: center;
      padding: 60px 20px;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .site-header {
        padding: 12px 18px;
      }
      .header-nav {
        gap: 8px;
      }
      .header-nav a {
        font-size: 0.9rem;
        padding: 4px 8px;
      }
      .container {
        padding: 20px 16px 60px 16px;
      }
      .hero-title {
        font-size: 2.2rem;
      }
      .section-title {
        font-size: 1.6rem;
      }
      .btn-contact-mail, .btn-contact-x, .btn-contact-general {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- 固定ヘッダーバー -->
  <header class="site-header">
    <a href="#" class="header-logo">PORTFOLIO</a>
    <nav class="header-nav">
      <a href="#about">About</a>
      <a href="#techstack">TechStack</a>
      <a href="#works">Works</a>
      <a href="#strengths">Strengths</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <div class="container">
    <section class="hero">
      <h1 class="hero-title">Portfolio</h1>
      <p class="hero-subtitle">UI Design & Frontend Development / AI-Assisted DX</p>
    </section>

    <main id="app">
      <div class="status-msg">データを読み込み中...</div>
    </main>

    <footer>
      <p>&copy; <span id="year"></span> Portfolio. All rights reserved.</p>
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    async function loadPortfolio() {
      const app = document.getElementById('app');
      try {
        const res = await fetch('./data.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const data = await res.json();

        // 1. 背景画像の設定
        const bgAsset = (data.asset || []).find(a => a.title === 'ページ背景');
        if (bgAsset && bgAsset.image) {
          document.body.style.backgroundImage = `url('${bgAsset.image}')`;
        }

        // バナーアセットマップ
        const bannerMap = {};
        (data.asset || []).forEach(a => {
          if (a.type === 'banner' || a.title) {
            bannerMap[a.title] = a.image;
          }
        });

        let html = '';

        // ------------------ (1) About ------------------
        if (data.About && data.About.length > 0) {
          html += `
          <section id="about" class="section-wrapper">
            <div class="section-header">
              <span class="section-tag">Profile</span>
              <h2 class="section-title">About</h2>
            </div>
            <div class="about-content">`;

          const leadItem = data.About.find(item => item.id === 1);
          if (leadItem) {
            html += `
              <div class="about-lead">
                ${escapeHtml(leadItem.summary)}
                <span class="about-lead-sub">${escapeHtml(leadItem.detail)}</span>
              </div>`;
          }

          html += `<div class="about-list">`;
          data.About.filter(item => item.id > 1 && item.id < 5).forEach(item => {
            html += `
              <div class="about-item">
                ${item.summary ? `<span class="about-item-summary">${escapeHtml(item.summary)}</span>` : ''}
                <span class="about-item-detail">${escapeHtml(item.detail)}</span>
              </div>`;
          });
          html += `</div>`;

          const closingItem = data.About.find(item => item.id === 5);
          if (closingItem) {
            html += `<div class="about-closing">${escapeHtml(closingItem.detail)}</div>`;
          }

          html += `</div>`;

          if (bannerMap['About']) {
            html += `
              <div class="section-divider-banner">
                <img src="${bannerMap['About']}" alt="About Banner" loading="lazy">
              </div>`;
          }

          html += `</section>`;
        }

        // ------------------ (2) TechStack ------------------
        if (data.TechStack && data.TechStack.length > 0) {
          html += `
          <section id="techstack" class="section-wrapper">
            <div class="section-header">
              <span class="section-tag">Skills & Technology</span>
              <h2 class="section-title">TechStack</h2>
            </div>
            <div class="tech-stack-list">`;

          data.TechStack.forEach(cat => {
            html += `
              <div class="tech-group">
                <div class="tech-group-title">${escapeHtml(cat.technology)}</div>
                <div class="tech-items">`;
            (cat.skills || []).forEach(skill => {
              html += `
                <div class="tech-line">
                  ${skill.system ? `<span class="tech-badge">${escapeHtml(skill.system)}</span>` : ''}
                  <span>${escapeHtml(skill.explanation)}</span>
                </div>`;
            });
            html += `</div></div>`;
          });

          html += `</div>`;

          if (bannerMap['TechStack']) {
            html += `
              <div class="section-divider-banner">
                <img src="${bannerMap['TechStack']}" alt="TechStack Banner" loading="lazy">
              </div>`;
          }

          html += `</section>`;
        }

        // ------------------ (3) Works ------------------
        if (data.Works && data.Works.length > 0) {
          html += `
          <section id="works" class="section-wrapper">
            <div class="section-header">
              <span class="section-tag">Portfolio & Showcase</span>
              <h2 class="section-title">Works</h2>
            </div>
            <div class="works-list">`;

          data.Works.forEach(work => {
            html += `
              <div class="work-entry">
                ${work.image ? `
                  <div class="work-thumb-wrap">
                    <img src="${work.image}" alt="${escapeHtml(work.title)}" loading="lazy">
                  </div>` : ''}
                <div class="work-info-title">${escapeHtml(work.title)}</div>
                <div class="work-info-comment">${escapeHtml(work.comment)}</div>
                ${work.tags && work.tags.length > 0 ? `
                  <div class="work-tags">
                    ${work.tags.map(t => `<span class="work-tag">${escapeHtml(t)}</span>`).join('')}
                  </div>` : ''}
                <div class="work-btn-group">
                  ${work.web ? `<a href="${work.web}" target="_blank" rel="noopener noreferrer" class="btn btn-main"><i class="fa-solid fa-arrow-up-right-from-square"></i> Webサイトを見る</a>` : ''}
                  ${work.admin ? `<a href="${work.admin}" target="_blank" rel="noopener noreferrer" class="btn btn-sub"><i class="fa-solid fa-sliders"></i> 管理画面</a>` : ''}
                  ${work.github ? `<a href="${work.github}" target="_blank" rel="noopener noreferrer" class="btn btn-sub"><i class="fa-brands fa-github"></i> GitHub</a>` : ''}
                </div>
              </div>`;
          });

          html += `</div>`;

          if (bannerMap['Works']) {
            html += `
              <div class="section-divider-banner">
                <img src="${bannerMap['Works']}" alt="Works Banner" loading="lazy">
              </div>`;
          }

          html += `</section>`;
        }

        // ------------------ (4) Strengths ------------------
        if (data.Strengths && data.Strengths.length > 0) {
          html += `
          <section id="strengths" class="section-wrapper">
            <div class="section-header">
              <span class="section-tag">Value & Approach</span>
              <h2 class="section-title">Strengths</h2>
            </div>
            <div class="strengths-list">`;

          data.Strengths.forEach(st => {
            html += `
              <div class="strength-entry">
                <div class="strength-lead">${escapeHtml(st.summary)}</div>
                <div class="strength-body">${escapeHtml(st.detail)}</div>
              </div>`;
          });

          html += `</div>`;

          if (bannerMap['Strengths']) {
            html += `
              <div class="section-divider-banner">
                <img src="${bannerMap['Strengths']}" alt="Strengths Banner" loading="lazy">
              </div>`;
          }

          html += `</section>`;
        }

        // ------------------ (5) Contact ------------------
        if (data.Contact && data.Contact.length > 0) {
          html += `
          <section id="contact" class="section-wrapper">
            <div class="section-header">
              <span class="section-tag">Get in touch</span>
              <h2 class="section-title">Contact</h2>
            </div>
            <div class="contact-container">
              <div class="contact-buttons-row">`;

          let emailFallbackAddress = '';

          data.Contact.forEach(ct => {
            const rawType = String(ct.type || ct.item || '').trim().toLowerCase();
            const val = String(ct.value || '').trim();
            const itemLabel = String(ct.item || '').trim();

            if (rawType.includes('メール') || rawType === 'mail' || rawType === 'email') {
              emailFallbackAddress = val;
              html += `
                <a href="mailto:${val}" class="btn-contact-mail">
                  <i class="fa-solid fa-envelope"></i> お問い合わせ
                </a>`;
            } else if (rawType.includes('x') || rawType.includes('twitter')) {
              const labelText = itemLabel ? `${itemLabel}へ移動` : 'Xへ移動';
              html += `
                <a href="${val}" target="_blank" rel="noopener noreferrer" class="btn-contact-x">
                  <i class="fa-brands fa-x-twitter"></i> ${escapeHtml(labelText)}
                </a>`;
            } else {
              const isHttp = val.startsWith('http');
              const targetAttr = isHttp ? 'target="_blank" rel="noopener noreferrer"' : '';
              html += `
                <a href="${val}" ${targetAttr} class="btn-contact-general">
                  <i class="fa-solid fa-arrow-up-right-from-square"></i> ${escapeHtml(itemLabel || 'リンクへ移動')}
                </a>`;
            }
          });

          html += `</div>`;

          if (emailFallbackAddress) {
            html += `
              <div class="contact-email-fallback">
                メールが開けない場合こちらのアドレスまで：<span>${escapeHtml(emailFallbackAddress)}</span>
              </div>`;
          }

          html += `</div></section>`;
        }

        app.innerHTML = html;

      } catch (err) {
        console.error(err);
        app.innerHTML = `
          <div class="status-msg" style="color: #ef4444;">
            データの読み込みに失敗しました。<br>
            <span style="font-size:0.9rem;">${escapeHtml(err.message)}</span>
          </div>`;
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    loadPortfolio();
  </script>
</body>
</html>
